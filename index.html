<!DOCTYPE html>
<html lang="ja" class="scroll-smooth scroll-pt-20">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルホームページ制作｜大田区サンポット — お店のデジタル看板を、1ページで。</title>
  <meta name="description" content="飲食店のための、1ページ完結シンプルホームページ。制作費¥25,000、月額¥0。お店のデジタル看板を、大田区サンポットが作ります。">

  <!-- Open Graph -->
  <meta property="og:title" content="シンプルホームページ制作｜大田区サンポット">
  <meta property="og:description" content="お店のデジタル看板を、1ページで。制作費¥25,000、月額¥0。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ota-sanpot.github.io/simple-hp/">

  <!-- Fonts: Noto Sans JP のみ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sumi:   '#1A1613',
            kinari: '#F5EFE4',
            paper:  '#FBF8F1',
            gold:   '#A87B4B',
            goldlt: '#C9A063',
            sub:    '#6B5A4E',
            line:   '#D9CFBD',
          },
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
          },
          letterSpacing: {
            wider2: '.22em',
            jumbo:  '.4em',
          },
        }
      }
    }
  </script>

  <style>
    html, body { background: #FBF8F1; color: #1A1613; }
    body { font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }

    /* ヘアライン */
    .hairline { background: linear-gradient(90deg, transparent, #A87B4B 20%, #A87B4B 80%, transparent); height: 1px; }

    /* スクロールリビール */
    .reveal { opacity: 0; transform: translateY(24px); transition: all 1.1s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* セクション共通 */
    .section-wrap { max-width: 920px; margin: 0 auto; padding: 96px 24px; }
    @media (min-width: 768px) { .section-wrap { padding: 128px 32px; } }

    /* ラベル（small caps風） */
    .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .4em; color: #A87B4B; text-transform: uppercase; }

    /* CTAボタン */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      background: #1A1613; color: #fff;
      padding: 16px 36px;
      font-size: 13px; font-weight: 500; letter-spacing: .2em;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease;
    }
    .btn-primary:hover { background: #2C2620; transform: translateY(-1px); }
    .btn-outline {
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #1A1613; color: #1A1613;
      padding: 14px 32px;
      font-size: 13px; font-weight: 500; letter-spacing: .2em;
      text-decoration: none;
      transition: background .2s ease, color .2s ease;
    }
    .btn-outline:hover { background: #1A1613; color: #fff; }
  </style>
</head>
<body>

  <!-- Header (Task 12 で実装) -->

  <main>
    <!-- SECTION 01 / HERO (Task 2) -->
    <section id="hero" class="bg-paper">
      <div class="section-wrap text-center">
        <p class="eyebrow reveal">OTA SANPOT　／　YOUR DIGITAL STOREFRONT</p>

        <div class="hairline reveal" style="width:64px;margin:32px auto 40px;"></div>

        <h1 class="reveal" style="font-size:clamp(28px,5vw,46px);font-weight:300;line-height:1.6;letter-spacing:.04em;color:#1A1613;">
          お店の<span style="font-weight:500;">"想い"</span>が、<br>ちゃんと届く。
        </h1>

        <p class="reveal" style="margin-top:32px;font-size:14px;line-height:2.1;font-weight:300;color:#6B5A4E;">
          お店の<span style="color:#A87B4B;font-weight:500;">"デジタル看板"</span>を、1ページで。<br>
          メニューと、地図と、ひとことの想い。<br>それだけで、十分です。
        </p>

        <div class="reveal" style="margin-top:48px;font-size:12px;letter-spacing:.2em;color:#1A1613;">
          制作費 <span style="font-weight:700;">¥25,000</span> 　／　 月額 <span style="font-weight:700;">¥0</span>
        </div>

        <div class="reveal" style="margin-top:40px;">
          <a href="#contact" class="btn-primary">無料で相談する</a>
        </div>

        <p class="reveal" style="margin-top:16px;font-size:11px;color:#A87B4B;letter-spacing:.15em;">税込・お見積もり無料</p>
      </div>
    </section>
    <!-- SECTION 02 / SHOWCASE (Task 3) -->
    <!-- SECTION 03 / PAIN (Task 4) -->
    <!-- SECTION 04 / CONCEPT (Task 5) -->
    <!-- SECTION 05 / VALUE (Task 6) -->
    <!-- SECTION 06 / SCOPE (Task 7) -->
    <!-- SECTION 07 / FLOW (Task 8) -->
    <!-- SECTION 08 / TRUST (Task 9) -->
    <!-- SECTION 09 / FAQ (Task 10) -->
    <!-- SECTION 10 / CTA (Task 11) -->
  </main>

  <!-- Footer (Task 12 で実装) -->

  <script>
    // スクロールリビール
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  </script>

</body>
</html>
